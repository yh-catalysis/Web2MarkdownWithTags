name = "web2markdown-with-tags"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "true" to allow image conversion (uses Workers AI Neurons = paid).
# "false" to restrict to free conversions only (PDF, HTML, Office, etc.).
ALLOW_IMAGE_CONVERSION = "false"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

# Previews (`wrangler preview`) get only the bindings and secrets listed here.
# None of AUTH_TOKEN, AI or BROWSER is given, so /mcp and /api/* return 503 and
# only /health responds. See docs/reference.md to enable them.
[previews.vars]
ALLOW_IMAGE_CONVERSION = "false"
